<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Base: monospace, dry, terminal-ish ── */
    :root {
      --fg: #1a1a1a;
      --dim: #666;
      --faint: #999;
      --rule: #ddd;
      --bg: #fdfdfc;
      --link: #0a3069;
    }
    body {
      font-family: "IBM Plex Mono", "SFMono-Regular", "SF Mono", "Menlo",
                   "Consolas", "DejaVu Sans Mono", monospace;
      font-size: 15.5px;
      line-height: 1.5;
      color: var(--fg);
      background: var(--bg);
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 2rem 1.5rem 3rem;
    }

    /* ── Typography ── */
    h2 {
      margin-top: 1.9rem;
      margin-bottom: 0.45rem;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    h3 {
      margin-top: 1.3rem;
      margin-bottom: 0.55rem;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--dim);
    }
    h3::before { content: "# "; color: var(--faint); }

    /* ── Links ── */
    a {
      color: var(--link);
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }
    a:hover {
      border-bottom-color: var(--link);
    }

    /* ── Intro block ── */
    .intro {
      margin-bottom: 2.1rem;
      line-height: 1.7;
    }
    .intro .namebar {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.35rem 0.8rem;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 0.4rem;
    }
    .intro .name {
      font-size: 1.5rem;
      font-weight: 600;
      flex: 1 0 auto;
      white-space: nowrap;
    }
    .intro .barlinks {
      display: flex;
      flex-wrap: wrap;
      gap: 0.15rem 1rem;
      font-size: 0.84rem;
      color: var(--dim);
      white-space: nowrap;
    }
    .intro .bio {
      font-size: 0.85em;
      margin-top: 0.7rem;
    }
    @media (max-width: 560px) {
      .intro .barlinks { white-space: normal; }
    }

    /* ── Sections ── */
    .block h2 {
      margin-top: 2.4rem;
      margin-bottom: 0.8rem;
    }

    /* ── Updates ── */
    .news-list {
      list-style: none;
      padding-left: 0;
    }
    .news-list li {
      display: flex;
      flex-wrap: wrap;
      gap: 0 0.9rem;
      margin-bottom: 0.35rem;
      line-height: 1.7;
    }
    .news-date {
      flex: 0 0 4.5rem;
      font-size: 0.85em;
      color: var(--faint);
      white-space: nowrap;
    }
    .news-body {
      flex: 1;
      min-width: 0;
      font-size: 0.85em;
    }

    /* ── Publication list ── */
    .pub-list {
      list-style: none;
      padding-left: 0;
    }
    .pub-list > li {
      margin-bottom: 0.95rem;
      line-height: 1.5;
    }
    .pub-title {
      font-size: 0.85em;
    }
    .pub-authors {
      font-size: 0.85em;
      color: var(--dim);
    }
    .pub-authors .au { white-space: nowrap; }
    .pub-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 0 1rem;
    }
    .pub-venue {
      font-size: 0.85em;
      color: var(--faint);
    }
    .pub-links {
      display: flex;
      gap: 1rem;
      font-size: 0.85em;
      white-space: nowrap;
    }


    /* ── Responsive ── */
    @media (max-width: 600px) {
      body { font-size: 14px; }
      .container {
        padding: 1.5rem 1rem 3rem;
      }
      .news-date { flex-basis: 100%; }
    }
  </style>
  {% seo %}
</head>
<body>
  <div class="container">
    {{ content }}
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Base: monospace, dry, terminal-ish ── */
    :root {
      --fg: #1a1a1a;
      --dim: #666;
      --faint: #999;
      --rule: #ddd;
      --bg: #fdfdfc;
      --link: #0a3069;
    }
    body {
      font-family: "IBM Plex Mono", "SFMono-Regular", "SF Mono", "Menlo",
                   "Consolas", "DejaVu Sans Mono", monospace;
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--fg);
      background: var(--bg);
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.5rem 3rem;
    }

    /* ── Typography ── */
    h2 {
      margin-top: 1.9rem;
      margin-bottom: 0.45rem;
      font-size: 1.0rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    h3 {
      margin-top: 1.3rem;
      margin-bottom: 0.55rem;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--dim);
    }
    h3::before { content: "# "; color: var(--faint); }

    /* ── Links ── */
    a {
      color: var(--link);
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }
    a:hover {
      border-bottom-color: var(--link);
    }

    /* ── Intro block ── */
    .intro {
      margin-bottom: 2.1rem;
      line-height: 1.7;
    }
    .intro .namebar {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.35rem 0.8rem;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 0.4rem;
    }
    .intro .name {
      font-size: 1.5rem;
      font-weight: 600;
      flex: 1 0 auto;
      white-space: nowrap;
    }
    .intro .barlinks {
      font-size: 0.84rem;
      color: var(--dim);
      white-space: nowrap;
    }
    .intro .bio {
      font-size: 0.85rem;
      margin-top: 0.7rem;
    }
    @media (max-width: 560px) {
      .intro .barlinks { white-space: normal; }
    }

    /* ── Collapsible section header + segmented control ── */
    .block-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.25rem 0.6rem;
      margin-top: 1.9rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--rule);
    }
    .block-head h2 {
      margin: 0;
      flex: 1;
    }
    .segs {
      margin-left: auto;
      font-size: 0.84rem;
      color: var(--faint);
      white-space: nowrap;
    }
    .seg {
      margin-left: 0.4rem;
      cursor: pointer;
      user-select: none;
    }
    .seg::before { content: "["; }
    .seg::after  { content: "]"; }
    .seg:hover { color: var(--fg); }
    .seg.active { color: var(--fg); font-weight: 600; }

    /* ── Collapse / filter states ── */
    .block-body {
      margin-top: 0.6rem;
    }
    .block.mode-hide .block-body { display: none; }
    .block.mode-selected .pub-list > li:not(.key) { display: none; }
    .block.mode-selected .pub-section-extra { display: none; }

    /* ── Publication list ── */
    .pub-list {
      list-style: none;
      padding-left: 0;
    }
    .pub-list > li {
      margin-bottom: 0.8rem;
      padding-left: 1.1rem;
      line-height: 1.5;
      position: relative;
    }
    .pub-list > li::before {
      content: "-";
      position: absolute;
      left: 0;
      color: var(--faint);
    }
    .pub-list > li.key::before {
      content: "*";
      color: var(--fg);
    }
    .pub-title {
      font-size: 1em;
      font-weight: 600;
    }
    .pub-authors {
      font-size: 0.85em;
      color: var(--dim);
    }
    .pub-authors .au { white-space: nowrap; }
    .pub-authors ins {
      text-decoration: none;
      border-bottom: 1px solid var(--faint);
    }
    .pub-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.2rem 1rem;
    }
    .pub-venue {
      font-size: 0.85em;
      color: var(--faint);
    }
    .pub-links {
      font-size: 0.85em;
      white-space: nowrap;
    }

    /* ── Experience section ── */
    .exp-category {
      font-weight: 600;
      margin-top: 1.3rem;
      margin-bottom: 0.55rem;
      font-size: 0.92rem;
      color: var(--dim);
    }
    .exp-category::before { content: "# "; color: var(--faint); }
    .exp-list {
      list-style: none;
      padding-left: 0;
    }
    .exp-list li {
      margin-bottom: 0.8rem;
      padding-left: 1.1rem;
      line-height: 1.5;
      position: relative;
    }
    .exp-list li::before {
      content: "-";
      position: absolute;
      left: 0;
      color: var(--faint);
    }
    .exp-list li strong {
      font-weight: 600;
    }
    .exp-role {
      font-size: 0.85em;
      color: var(--dim);
    }
    .exp-desc {
      font-size: 0.85em;
      color: var(--faint);
    }

    /* ── Reviews ── */
    .reviews-inline {
      font-size: 0.85em;
      color: var(--dim);
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      body { font-size: 12.5px; }
      .container {
        padding: 1.5rem 1rem 3rem;
      }
    }
  </style>
  {% seo %}
</head>
<body>
  <div class="container">
    {{ content }}
  </div>
</body>
</html>
